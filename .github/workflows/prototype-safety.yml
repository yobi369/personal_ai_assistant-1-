name: Prototype safety checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run prototype safety checks
        run: python -m unittest discover -s tests -v
      - name: Run API tests
        run: pytest -q
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert scripts, "No inline application script found"
          Path("/tmp/personal-ai-assistant.js").write_text(chr(10).join(scripts), encoding="utf-8")
          PY
          node --check /tmp/personal-ai-assistant.js
      - name: Build container image
        run: docker build --tag personal-ai-assistant:test .
