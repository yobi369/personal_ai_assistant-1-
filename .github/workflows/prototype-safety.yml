name: Prototype safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://assistant:test-password@localhost:5432/assistant_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run prototype safety checks
        run: python -m unittest discover -s tests -v
      - name: Run API tests
        run: pytest -q
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Audit dependencies
        run: |
          pip install pip-audit bandit
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
          bandit -ll -q -r app.py scripts
      - name: Build container image
        run: docker build --tag personal-ai-assistant:test .
      - name: Run container smoke test
        run: |
          trap 'docker rm -f personal-ai-assistant-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name personal-ai-assistant-smoke -e APP_ORIGIN=https://localhost -e COOKIE_SECURE=true -p 18000:8000 personal-ai-assistant:test
          for attempt in $(seq 1 30); do
            if python scripts/smoke_test.py --url http://127.0.0.1:18000; then
              exit 0
            fi
            sleep 2
          done
          docker logs personal-ai-assistant-smoke
          exit 1
