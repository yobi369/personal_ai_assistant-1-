name: Prototype safety checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://assistant:test-password@localhost:5432/assistant_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run prototype safety checks
        run: python -m unittest discover -s tests -v
      - name: Run API tests
        run: pytest -q
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Build container image
        run: docker build --tag personal-ai-assistant:test .
